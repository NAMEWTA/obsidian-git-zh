# Mirror Vinzent03/obsidian-git master onto this fork's master, then merge
# that update into wta with a real merge commit (visible in git log).
# master is an upstream mirror only. Do not commit local work to master.
name: sync-upstream
on:
    schedule:
        - cron: "17 */6 * * *"
    workflow_dispatch:
permissions:
    contents: write
jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: master
            - name: Update master from upstream and merge into wta
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git remote add upstream https://github.com/Vinzent03/obsidian-git.git
                  git fetch upstream master
                  before="$(git rev-parse HEAD)"
                  git reset --hard upstream/master
                  after="$(git rev-parse HEAD)"
                  git push origin master
                  if [ "$before" = "$after" ]; then
                      echo "Upstream master is unchanged."
                      exit 0
                  fi
                  git checkout wta
                  git merge --no-ff master -m "merge: sync upstream master into wta"
                  git push origin wta
